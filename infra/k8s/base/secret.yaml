# Development secrets, committed on purpose and worth being explicit about why.
#
# These values are the same dev placeholders as .env.example -- they authenticate
# nothing that exists outside a laptop. Committing them keeps `kubectl apply -k`
# a single command for anyone cloning the repo, which is the point of the dev
# overlay.
#
# **The prod overlay does not use this file.** It expects the secret to already
# exist in the cluster, created out of band:
#
#   kubectl -n resumeforge create secret generic resumeforge-secrets \
#     --from-literal=INTERNAL_API_KEY=... --from-literal=JWT_SECRET=... \
#     --from-literal=ENCRYPTION_KEY=... --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=GEMINI_API_KEY=...
#
# A real deployment would use External Secrets or SOPS rather than a human
# running that command, but the property that matters is the same either way:
# production secrets never enter this repository.
apiVersion: v1
kind: Secret
metadata:
  name: resumeforge-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: "resumeforge"
  INTERNAL_API_KEY: "dev-internal-key-change-me"
  JWT_SECRET: "dev-jwt-secret-change-me"
  ENCRYPTION_KEY: "dev-encryption-key-change-me-32b"
  # Empty on purpose: the pipeline falls back to a deterministic mock provider
  # without a key, so the cluster is fully explorable with no credentials and no
  # spend. Set it in the prod overlay's out-of-band secret to run real models.
  GEMINI_API_KEY: ""
