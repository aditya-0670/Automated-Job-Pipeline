# The compose file's two networks, expressed for Kubernetes.
#
# Without a NetworkPolicy every pod can reach every other pod, so the `web`
# container -- the one running code closest to the browser -- could talk
# straight to Postgres. These policies make the boundary real rather than
# conventional: `web` may only be reached by the ingress and may only reach the
# gateway; `ai` and `postgres` accept nothing from `web` at all.
#
# kindnet **does** enforce these as of kind v0.30, which is worth knowing before
# you assume a local cluster ignores them: the first apply left the migration Job
# retrying forever on "waiting for postgres..." while the gateway -- which the
# policy allows -- connected fine. A policy that is only enforced in production
# is a policy that fails in production.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-accepts-only-api
spec:
  podSelector:
    matchLabels:
      app: ai
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-accepts-only-services
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: ai } }
        - podSelector: { matchLabels: { app: api } }
        - podSelector: { matchLabels: { app: db-migrate } }
      ports:
        - port: 5432
