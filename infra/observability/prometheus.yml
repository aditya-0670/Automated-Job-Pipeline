# Prometheus, scraping the two services that export metrics.
#
# Static targets, not service discovery: this scrapes a compose network with
# four containers, and running a discovery mechanism to find four known names
# would be machinery protecting nothing.
global:
  scrape_interval: 15s
  # Shorter than the interval, so a slow scrape is visible as a failed scrape
  # rather than silently overlapping the next one.
  scrape_timeout: 10s
  external_labels:
    environment: local

scrape_configs:
  - job_name: ai
    metrics_path: /metrics
    static_configs:
      - targets: ["ai:8000"]
        labels:
          service: ai

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:4000"]
        labels:
          service: api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
