# Release: build and publish images to GHCR.
#
# Triggered by a version tag. CI (ci.yml) proves the code is good; this
# workflow's job is to produce a traceable artifact from it.

name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. v0.3.0)'
        required: true

permissions:
  contents: read
  packages: write   # required to push to GHCR
  id-token: write   # for provenance attestation

jobs:
  publish-ai:
    name: Publish AI service image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Provided automatically; no PAT to rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/ai
          # Three tags per release, each with a purpose:
          #   semver  -- what a human deploys
          #   sha     -- what a rollback targets, unambiguously
          #   latest  -- convenience for local pulls only
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: services/ai
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ai-runtime
          cache-to: type=gha,scope=ai-runtime,mode=max

      - name: Attest provenance
        # Records how the image was built, so a deployed digest is traceable
        # back to this commit and workflow.
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/ai
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summarise
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
