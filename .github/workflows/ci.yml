# Continuous integration.
#
# Structure: a `changes` job computes which service directories were touched,
# and every downstream job is gated on it. Editing the frontend must not run
# Python tests -- in a monorepo that filtering is what keeps CI honest about
# what it actually verified (see docs/07-decision-log.md ADR-001).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      ai: ${{ steps.filter.outputs.ai }}
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ai:
              - 'services/ai/**'
              - '.github/workflows/ci.yml'
            api:
              - 'services/api/**'
              - '.github/workflows/ci.yml'
            web:
              - 'services/web/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'docker-compose*.yml'
              - 'infra/**'
              - '.github/workflows/**'

  # ── AI service ────────────────────────────────────────────────────────
  ai-lint:
    name: ai · lint
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ai/requirements-dev.txt
      - name: Install ruff
        working-directory: services/ai
        run: pip install "$(grep '^ruff==' requirements-dev.txt)"
      - name: Lint
        working-directory: services/ai
        run: ruff check .
      - name: Format check
        working-directory: services/ai
        run: ruff format --check .

  ai-test:
    name: ai · test
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest

    # A real Postgres, because the checkpointing tests (Part 10) assert crash
    # recovery against actual serialisation, and a mock would assert nothing.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: resumeforge
          POSTGRES_PASSWORD: resumeforge
          POSTGRES_DB: resumeforge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U resumeforge -d resumeforge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://resumeforge:resumeforge@localhost:5432/resumeforge_test
      REDIS_URL: redis://localhost:6379
      INTERNAL_API_KEY: ci-internal-key
      # No GEMINI_API_KEY on purpose. The pipeline must be fully exercisable
      # without credentials via MockProvider (ADR-003); live-API tests are
      # marked `integration` and skip themselves. This keeps CI hermetic and
      # means a rotated key can never turn the build red.
      LLM_PROVIDER: gemini

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ai/requirements-dev.txt
      - name: Install dependencies
        working-directory: services/ai
        run: pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: services/ai
        run: pytest tests/ -v --junitxml=junit.xml
      - name: Benchmarks (informational)
        working-directory: services/ai
        # Printed into the log so a regression in the Aho-Corasick numbers is
        # visible in CI history. Not a gate: runner performance varies too much
        # between jobs for a wall-clock threshold to mean anything.
        run: pytest tests/test_benchmark.py -s --no-header
      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-junit
          path: services/ai/junit.xml

  ai-build:
    name: ai · build image
    needs: [changes, ai-lint, ai-test]
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: services/ai
          target: runtime
          # Verify it builds; publishing happens in release.yml on a tag.
          push: false
          load: true
          tags: resumeforge-ai:ci
          cache-from: type=gha,scope=ai-runtime
          cache-to: type=gha,scope=ai-runtime,mode=max
      - name: Smoke test the image
        # A built image that cannot answer /health is not a passing build.
        run: |
          docker run -d --name ai-smoke \
            -e INTERNAL_API_KEY=ci-internal-key \
            -p 8000:8000 resumeforge-ai:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "healthy after ${i}s"; break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::service never became healthy"; docker logs ai-smoke; exit 1
            fi
            sleep 1
          done
          curl -fsS http://localhost:8000/ready | tee /dev/stderr
          # The trust boundary must hold: no key, no service.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{"job_text":"x"}' \
            http://localhost:8000/internal/extract)
          test "$code" = "401" || { echo "::error::expected 401 without key, got $code"; exit 1; }
          docker rm -f ai-smoke

  ai-integration:
    name: ai · integration (browser + LaTeX)
    needs: [changes, ai-test]
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime-test image
        uses: docker/build-push-action@v6
        with:
          context: services/ai
          target: runtime-test
          push: false
          load: true
          tags: resumeforge-ai:runtime-test
          cache-from: type=gha,scope=ai-runtime
          cache-to: type=gha,scope=ai-runtime,mode=max
      - name: Verify Chromium and pdflatex work as the service user
        # The fast test image has neither, so these paths are otherwise
        # unverified -- which is exactly how a Chromium-not-found bug shipped.
        run: |
          docker run --rm resumeforge-ai:runtime-test \
            pytest tests/test_runtime_image.py -v

  # ── Infra ─────────────────────────────────────────────────────────────
  compose-validate:
    name: infra · validate compose
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate production compose file
        env:
          INTERNAL_API_KEY: validate-only
        # Without the override file, which is development-only.
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate with dev override
        env:
          INTERNAL_API_KEY: validate-only
        run: docker compose config --quiet

  # A single required status check, so branch protection does not need updating
  # every time a job is added or a path filter skips one.
  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    needs: [ai-lint, ai-test, ai-integration, ai-build, compose-validate]
    if: always()
    steps:
      - name: Fail if any job failed
        # Skipped jobs are fine -- that is the path filter doing its job.
        # Only genuine failures and cancellations should block.
        run: |
          results='${{ join(needs.*.result, " ") }}'
          echo "job results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job reported '$r'"; exit 1 ;;
            esac
          done
          echo "all good"
